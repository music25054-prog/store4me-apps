<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J2ME App Store</title>
    <style>
        :root {
            --bg-color: #121417;
            --card-bg: #1c1f24;
            --card-hover: #252930;
            --accent: #00d2ff;
            --accent-hover: #00b8e6;
            --text-main: #f0f2f5;
            --text-muted: #9aa0a6;
            --border: #2c313a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        header h1 span {
            color: var(--accent);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 240px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .stats {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            background-color: var(--card-hover);
            border-color: #3d4450;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .app-icon {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            background: linear-gradient(135deg, #2b323c, #1a1e24);
            border: 1px solid #3a414e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--accent);
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .app-info h2 {
            font-size: 1.1rem;
            font-weight: 600;
            word-break: break-word;
        }

        .version-badge {
            display: inline-block;
            margin-top: 4px;
            padding: 2px 8px;
            font-size: 0.78rem;
            font-weight: 600;
            background-color: rgba(0, 210, 255, 0.12);
            color: var(--accent);
            border-radius: 6px;
            font-family: monospace;
        }

        .download-btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 10px 14px;
            background-color: var(--accent);
            color: #0b0d0f;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .download-btn:hover {
            background-color: var(--accent-hover);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px dashed var(--border);
        }

        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        code {
            background: var(--card-bg);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--accent);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>J2ME <span>Store</span></h1>
        <p>Каталог приложений для Java ME / MIDP 2.0</p>
    </header>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Поиск по названию или версии...">
        </div>
        <div class="stats" id="statsText">Загрузка...</div>
    </div>

    <div class="grid" id="appsGrid"></div>

    <footer>
        Данные загружаются из <code>j2me_apps.json</code> (со встроенным резервом для локального запуска).
    </footer>
</div>

<script>
    // Встроенные данные на случай открытия index.html напрямую без локального веб-сервера (file://)
    const FALLBACK_DATA = {
      "apps": [
        { "name": "BredGen", "version": "1.3.2" },
        { "name": "discofi", "version": "1.0" },
        { "name": "J2Schedule", "version": "0.0.5" },
        { "name": "Maho-maps", "version": "1.2.4" },
        { "name": "MahoLichki", "version": "1.1.5" },
        { "name": "MiniCommander", "version": "4.2" },
        { "name": "MobileRar", "version": "1.0" },
        { "name": "mpgram", "version": "1.6.6" },
        { "name": "Opera mini", "version": "8" },
        { "name": "PaintCAD", "version": "3.0.24" },
        { "name": "TubeME", "version": "0.4.0" },
        { "name": "VK4ME", "version": "3.3.4" }
      ]
    };

    let allApps = [];
    const grid = document.getElementById('appsGrid');
    const searchInput = document.getElementById('searchInput');
    const statsText = document.getElementById('statsText');

    function getDownloadLink(app) {
        // Формирует ожидаемое имя файла: например, apps/BredGen-1.3.2.jar
        const safeName = app.name.replace(/\s+/g, '_');
        return `apps/${safeName}-${app.version}.jar`;
    }

    function renderApps(apps) {
        grid.innerHTML = '';
        statsText.textContent = `Приложений: ${apps.length}`;

        if (apps.length === 0) {
            grid.innerHTML = '<div class="empty-state">Ничего не найдено по вашему запросу.</div>';
            return;
        }

        apps.forEach(app => {
            const card = document.createElement('div');
            card.className = 'card';

            const initial = app.name.charAt(0);
            const downloadUrl = getDownloadLink(app);

            card.innerHTML = `
                <div class="card-header">
                    <div class="app-icon">${initial}</div>
                    <div class="app-info">
                        <h2>${app.name}</h2>
                        <span class="version-badge">v${app.version}</span>
                    </div>
                </div>
                <a href="${downloadUrl}" class="download-btn" download>Скачать .JAR</a>
            `;
            grid.appendChild(card);
        });
    }

    async function initStore() {
        try {
            const response = await fetch('j2me_apps.json');
            if (!response.ok) throw new Error('HTTP error');
            const data = await response.json();
            allApps = data.apps || [];
        } catch (err) {
            // Если открыто локально без сервера, берем данные из FALLBACK_DATA
            allApps = FALLBACK_DATA.apps;
        }
        renderApps(allApps);
    }

    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        const filtered = allApps.filter(app =>
            app.name.toLowerCase().includes(query) ||
            app.version.toLowerCase().includes(query)
        );
        renderApps(filtered);
    });

    initStore();
</script>

</body>
</html>
